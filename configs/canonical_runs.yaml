  exp_a_krum_f3:          "f-sweep robustness check"
  exp_a_krum_f6:          "f-sweep robustness check"
  exp_a_krum_randhm:      "attribution test (randomized HM); mechanism check"
  exp_b_strategic_delay_trustfl: "SUPERSEDED by exp_b2_delay_trustfl (attack bug)"
  exp_b_strategic_delay_fltrust: "SUPERSEDED by exp_b2_delay_fltrust"
  exp_b_strategic_delay_fedavg:  "SUPERSEDED by exp_b2_delay_fedavg"
  cal_evasive_fedavg_p1.0: "evasive-attack calibration (null result)"
  cal_evasive_fedavg_p3.0: "evasive-attack calibration (null result)"
  cal_evasive_fedavg_p6.0: "evasive-attack calibration (null result)"
  cal_femnist_fedavg:      "FEMNIST model calibration run"
  mnist_fedavg_debug:      "environment verification"
  mnist_trustfl_debug:     "environment verification"
  mnist_attack_fedavg:     "early grad_scale demo (pre-store); may promote later"
  smoke_synthetic:         "synthetic smoke test"
  ev_fedavg:               "container smoke test"
  ev_fedgreed:             "container smoke test"
  ev_fltrust:              "container smoke test"
  ev_multikrum:            "container smoke test"
  ev_trustfl:              "container smoke test"
