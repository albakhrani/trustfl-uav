# Option A: stronger threat model for the adaptive-system headline (Claim 4).
#
# Two fair environment changes vs the base flagship config:
#  1. resources.compute_deadline: true  -> updates whose ACTUAL compute time
#     exceeds compute_slack x expected time are DROPPED. Converts resource-misreporting from
#     "wasted cycles" into real honest-data loss. Applied to ALL UAVs.
#  2. malicious_fraction 0.4 -> fewer honest UAVs to absorb the damage, so the
#     effect reaches the retention/influence metrics.
#
# Justification (open-FL threat model, NOT the disaster scenario): ad-hoc
# third-party nodes of unknown provenance in permissionless FL; a high
# adversarial fraction and real compute deadlines are properties of open,
# resource-constrained federated systems.
#
# Evaluated on RETENTION and INFLUENCE (the metrics the audit proved decisive),
# not accuracy. Run once per method:
#   --override method.name=trustfl / fltrust / fedgreed / fedavg / multikrum
name: exp_a_hardened
seed: 42
seeds: [0, 1, 2]
out_dir: ./results
data: {dataset: mnist, dirichlet_alpha: 0.2}
train: {rounds: 100, local_epochs: 2, eval_every: 5}
uav: {num_uavs: 30, high_mobility_fraction: 0.3, high_mobility_speed_factor: 3.0}
resources: {compute_deadline: true, compute_slack: 1.5}
trust: {k_max: 12, weight_mode: learnable}
method: {name: trustfl, krum_f: 12, multikrum_m: 8}
attack: {attack_type: adaptive_system, malicious_fraction: 0.4,
         adaptive_trust_target: 0.6, misreport_factor: 2.0}
